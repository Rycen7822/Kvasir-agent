name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run P4 acceptance gate
        run: python scripts/p4_acceptance.py

      - name: Run high-confidence dead-code scan
        run: python -m vulture codex_scientist scripts tests --min-confidence 100

      - name: Compile Python sources
        run: python -m compileall -q codex_scientist scripts tests

      - name: Smoke-test MCP initialize
        run: python scripts/cs_mcp.py --stdio-smoke initialize

      - name: Smoke-test MCP tool list
        run: python scripts/cs_mcp.py --stdio-smoke tools/list
