[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "kvasir-agent"
version = "0.2.0"
description = "Codex CLI plugin with a stable curated MCP control plane for research provenance workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kvasir-agent Hermes adaptation" }]
dependencies = [
  "PyYAML>=6.0.1",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "vulture>=2.14",
]

[tool.hatch.build.targets.wheel]
packages = ["kvasir_agent"]

[tool.hatch.build.targets.wheel.force-include]
".codex-plugin" = ".codex-plugin"
".mcp.json" = ".mcp.json"
"docs" = "docs"
"scripts" = "scripts"
"skills" = "skills"
"manual" = "manual"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
