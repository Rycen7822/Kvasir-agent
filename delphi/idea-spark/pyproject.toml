[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-spark"
version = "0.1.0"
description = "Open research discussion and deep exploration using native agents and durable file delivery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
idea-spark = "idea_spark.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["idea_spark", "idea_spark.migrations"]
package-dir = {"idea_spark" = ".", "idea_spark.migrations" = "migrations"}
include-package-data = true

[tool.setuptools.package-data]
idea_spark = [
  "plugin.yaml",
  "migrations/*.sql",
  "resources/skills/idea-spark-usage/*.md",
  "resources/skills/idea-spark-usage/references/*.md",
  "resources/skills/idea-spark-usage/references/modes/*.md",
  "resources/skills/idea-spark-usage/references/roles/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
